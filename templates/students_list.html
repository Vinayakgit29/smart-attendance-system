<!DOCTYPE html>
<html>
<head>
    <title>Registered Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="navbar">
        <h2>Smart Attendance</h2>
        <div class="nav-links">
            <a class="button secondary" href="/">Home</a>
        </div>
    </div>
    <div class="container">
        <section class="card">
            <div class="section-header">
                <div>
                    <h1 class="page-title">Registered Students</h1>
                    <p class="page-subtitle">Search and browse the current student roster with fast filtering and responsive table views.</p>
                </div>
            </div>
            <form method="POST">
                <div class="form-group">
                    <label for="roll_number">Roll Number</label>
                    <input id="roll_number" type="text" name="roll_number" placeholder="Enter Roll Number" required>
                </div>
                <button type="submit" class="button">Search</button>
            </form>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ student[0] }}</td>
                            <td>{{ student[1] }}</td>
                            <td>{{ student[2] }}</td>
                            <td>{{ student[4] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    </div>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
</body>
<script src="{{ url_for('static', filename='js/theme_toggle.js') }}"></script>
</html>
