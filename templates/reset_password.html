<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Smart Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="url(#rg)"/>
                <path d="M16 8C11.58 8 8 11.58 8 16C8 20.42 11.58 24 16 24C20.42 24 24 20.42 24 16C24 11.58 20.42 8 16 8ZM16 10C19.31 10 22 12.69 22 16C22 19.31 19.31 22 16 22C12.69 22 10 19.31 10 16C10 12.69 12.69 10 16 10Z" fill="white"/>
                <circle cx="16" cy="14" r="2" fill="white"/>
                <path d="M12 20C12 18 13.5 17 16 17C18.5 17 20 18 20 20" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <defs><linearGradient id="rg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
            </svg>
            <span>Smart Attendance</span>
        </div>
        <div class="auth-heading">
            <h1>Reset your password</h1>
            <p>Set a new password for your account.</p>
        </div>
        {% if error %}
        <div class="alert error" style="margin-bottom:1.25rem">
            <span class="alert-icon">❌</span>
            <div class="alert-body"><h4>Error</h4><p>{{ error }}</p></div>
        </div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input id="password" type="password" name="password" required placeholder="New password" autocomplete="new-password">
                <small class="text-muted">Must contain uppercase, lowercase, number, and special character</small>
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input id="confirm" type="password" name="confirm" required placeholder="Repeat new password" autocomplete="new-password">
            </div>
            <button class="button primary" type="submit" style="width:100%">Reset Password</button>
        </form>
        <div class="auth-footer">
            <a href="/login">← Back to Login</a>
        </div>
    </div>
</div>
</body>
<script src="{{ url_for('static', filename='js/theme_toggle.js') }}"></script>
</html>
