<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Smart Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 45%, #831843 100%); min-height: 100vh; }
        .admin-badge {
            display: inline-flex; align-items: center; gap: 0.4rem;
            background: #fef3c7; color: #92400e;
            border: 1px solid #fde68a; border-radius: 999px;
            font-size: 0.78rem; font-weight: 600; padding: 0.25rem 0.75rem;
            margin-bottom: 1rem;
        }
        .back-link { display: block; text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-secondary); }
        .back-link a { color: var(--primary); font-weight: 500; }
    </style>
</head>
<body>
<div id="toast-container"></div>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="8" fill="url(#alg)"/>
                <path d="M16 8C11.58 8 8 11.58 8 16C8 20.42 11.58 24 16 24C20.42 24 24 20.42 24 16C24 11.58 20.42 8 16 8Z" fill="white"/>
                <defs><linearGradient id="alg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
            </svg>
            <span>Smart Attendance</span>
        </div>
        <div class="auth-heading">
            <div style="margin-bottom:0.75rem"><span class="admin-badge">🛡️ Admin Portal</span></div>
            <h1>Admin Sign In</h1>
            <p>Manage students, slots, and attendance records</p>
        </div>
        {% if error %}
        <div class="alert error" style="margin-bottom:1.25rem">
            <span class="alert-icon">❌</span>
            <div class="alert-body"><h4>Login Failed</h4><p>{{ error }}</p></div>
        </div>
        {% endif %}
        <form method="POST" id="admin-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" placeholder="admin@domain" required autocomplete="username">
                <small style="color:var(--text-muted);font-size:0.78rem">Format: admin@domain (e.g. admin@college)</small>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="button primary" style="width:100%;margin-top:0.5rem" id="admin-btn">Sign In as Admin</button>
        </form>
        <p class="back-link"><a href="/">← Back to Home</a></p>
    </div>
</div>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
<script>
document.getElementById('admin-form').addEventListener('submit', function() {
    const btn = document.getElementById('admin-btn');
    btn.textContent = 'Signing in…'; btn.disabled = true;
});
</script>
<script src="{{ url_for('static', filename='js/theme_toggle.js') }}"></script>
</body>
</html>
